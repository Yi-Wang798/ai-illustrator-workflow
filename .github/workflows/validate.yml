name: validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest pyyaml
      - run: python -m pytest -q
      - run: python -m json.tool plugins/ai-illustrator-workflow/.codex-plugin/plugin.json > $null
